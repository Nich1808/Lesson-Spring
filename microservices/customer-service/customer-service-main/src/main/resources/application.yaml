server:
  port: 9091

spring:

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9394

  application:
    name: customer-service

  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        health-check-url: http://host.docker.internal:9192/actuator/health


  mongodb:
    host: localhost
    port: 2027
    username: mongod
    password: mongod
    database: db_customer
    authentication-database: admin