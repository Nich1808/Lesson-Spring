server:
  port: 9091

spring:
  application:
    name: customer-service

  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        health-check-url: http://host.docker.internal:${server.port}/actuator/health


  mongodb:
    host: localhost
    port: 2027
    username: mongod
    password: mongod
    database: db_customer
    authentication-database: admin